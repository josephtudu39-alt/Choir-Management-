<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7a2e4d"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>MAS Choir Tracker</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2433;--mut:#6b7280;--line:#e5e1d8;--acc:#7a2e4d;--accs:#f3e3ea;--ok:#2f7d4f;--oks:#e1f2e8;--bad:#b3392f;--bads:#f8e2df;--warn:#b7791f;--warns:#fbefd5}
@media(prefers-color-scheme:dark){:root{--bg:#15171c;--card:#1f232b;--ink:#e8e9ee;--mut:#9aa0ad;--line:#323744;--acc:#e08bb0;--accs:#3a2530;--ok:#6cc790;--oks:#1e3327;--bad:#f08a80;--bads:#3b2321;--warn:#e5b455;--warns:#3a2f17}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:20px 16px 0;max-width:1560px;margin:auto}h1{margin:0;font-size:30px;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:15px}
nav{display:flex;gap:4px;max-width:1560px;margin:14px auto 0;padding:0 16px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 18px;font:inherit;color:var(--mut);cursor:pointer;white-space:nowrap}
nav button.on{color:var(--acc);border-color:var(--acc);font-weight:600}
main{max-width:1560px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}.kpi b{display:block;font-size:34px;line-height:1.1}.kpi span{color:var(--mut);font-size:14px}
h2{font-size:20px;margin:0 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input,select,button.b{font:inherit;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
button.b{cursor:pointer}button.pri{background:var(--acc);color:var(--card);border-color:var(--acc)}
button.b:hover{filter:brightness(.95)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);font-size:17px;vertical-align:middle}
th{font-size:13px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;white-space:nowrap}
.tw{overflow-x:auto}
.pill{display:inline-block;padding:3px 12px;border-radius:99px;font-size:14px;background:var(--accs);color:var(--acc)}
.pill.ok{background:var(--oks);color:var(--ok)}.pill.bad{background:var(--bads);color:var(--bad)}.pill.warn{background:var(--warns);color:var(--warn)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--mut);padding:10px 20px;font:inherit;cursor:pointer}
.seg button.p.on{background:var(--oks);color:var(--ok);font-weight:600}.seg button.a.on{background:var(--bads);color:var(--bad);font-weight:600}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--ok)}
.two{display:grid;gap:16px;grid-template-columns:1fr 1fr}@media(max-width:760px){.two{grid-template-columns:1fr}}
dialog{font-size:17px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:560px;width:94%}
dialog.wide{max-width:1040px}.idw{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}.idside{position:sticky;top:0}.idbox{border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:72vh;background:var(--bg)}.idimg{position:relative;width:100%;cursor:zoom-in}.idimg.z{width:220%;cursor:zoom-out}.idimg img{width:100%;display:block}.idov{position:absolute;box-sizing:border-box;border:2px dashed;border-radius:4px;cursor:text}.idov.on{border-style:solid;border-width:3px;background:rgba(255,200,0,.28)}@media(max-width:760px){.idw{grid-template-columns:1fr}.idside{z-index:2;background:var(--card);padding:4px 0 8px}.idbox{max-height:32vh}}
dialog label{display:block;font-size:14px;color:var(--mut);margin-top:10px}dialog input,dialog select{width:100%}
.av{width:72px;height:72px;border-radius:50%;object-fit:cover;background:var(--accs);color:var(--acc);display:inline-flex;align-items:center;justify-content:center;font-size:28px;font-weight:600;flex:none;vertical-align:middle;margin-right:16px}.av.lg{width:180px;height:180px;font-size:64px;margin:0 8px 0 0;border-radius:16px}.av.sm{width:44px;height:44px;font-size:18px;margin-right:8px}.nm{display:flex;align-items:center}.mut{color:var(--mut)}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:14px 22px;border-radius:12px;font-size:17px;opacity:0;transition:opacity .3s;z-index:99;pointer-events:none;max-width:90%}.hide{display:none}

/* ---------- Mobile ---------- */
html{-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select,label,summary{touch-action:manipulation}
nav{position:sticky;top:0;z-index:5;background:var(--bg);scrollbar-width:none}nav::-webkit-scrollbar{display:none}
#toast{bottom:calc(24px + env(safe-area-inset-bottom))}
@media(max-width:700px){
 body{font-size:16px}
 header{padding:14px 14px 0}h1{font-size:22px}header .sub{font-size:14px}
 main{padding:12px}.card{padding:12px;border-radius:10px}
 .top{padding:0 12px!important;gap:8px}.top>button{flex:1 1 calc(50% - 8px);padding:10px 8px;font-size:15px}
 nav{padding:0 8px;margin-top:10px}nav button{padding:12px 14px;font-size:16px}
 button.b,input,select{min-height:44px}
 input[type=checkbox]{min-height:0;width:20px;height:20px}
 main .row>input:not([type=checkbox]),main .row>select{flex:1 1 140px;min-width:0}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi{padding:12px}.kpi b{font-size:28px}
 h2{font-size:18px}
 th,td{font-size:16px}
 .seg button{padding:12px 18px}
 dialog{font-size:16px;width:96%;max-height:calc(100dvh - 20px);padding:14px;border-radius:14px}
 dialog.wide{max-width:96%}
 .av.lg{width:120px;height:120px;font-size:44px}
 .av{width:56px;height:56px;font-size:22px;margin-right:12px}
 /* wide tables become one card per row */
 table.rt,table.rt tbody,table.rt tr,table.rt td{display:block;width:100%}
 table.rt thead{display:block}
 table.rt thead tr{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 8px}
 table.rt thead th{border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:12px;background:var(--card)}
 table.rt.nohd thead{display:none}
 table.rt thead th:empty{display:none}
 table.rt tbody tr{border:1px solid var(--line);border-radius:12px;padding:6px 12px;margin-bottom:10px;background:var(--card)}
 table.rt td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:7px 0;text-align:right;min-height:40px}
 table.rt td::before{content:attr(data-l);color:var(--mut);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;text-align:left;flex:none}
 table.rt td:first-child{justify-content:flex-start;text-align:left;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:4px}
 table.rt td:first-child::before,table.rt td:not([data-l])::before{display:none}
 table.rt td:not([data-l]){justify-content:flex-end}
 .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
}
@media(max-width:380px){.top>button{flex:1 1 100%}}
</style></head><body>
<header><h1>MAS Choir Tracker <select id="sess" onchange="sessPick(this.value)" title="Switch year / session" style="font:inherit;padding:2px 8px;width:auto;vertical-align:middle"></select></h1>
<div class="sub">Import your roster (Excel or CSV), then track attendance · saved in this browser</div></header>
<div class="row top" style="max-width:1560px;margin:12px auto 0;padding:0 16px">
<button class="b pri" onclick="$('#file').click()">Import data</button>
<button class="b" onclick="$('#files').click()">Import photos</button>
<button class="b" onclick="$('#idf').click()">Scan ID card</button>
<input type="file" id="idf" class="hide" accept="image/*" onchange="scanId(this.files[0]);this.value=''">
<button class="b" onclick="template()">Download template</button>
<button class="b" id="syncb" onclick="syncNow(false)" style="margin-left:auto">☁ Sync</button>
<input type="file" id="files" class="hide" accept="image/*" multiple onchange="importPhotos([...this.files]);this.value=''">
<input type="file" id="file" class="hide" accept=".xlsx,.xls,.csv" onchange="importFile(this.files[0]);this.value=''"></div>
<nav id="nav"></nav>
<main id="main"></main>

<dialog id="dlg"><form method="dialog" id="frm"></form></dialog>
<dialog id="cropd"></dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const SEED=[];
const META='mas_choir_meta';
let meta;try{meta=JSON.parse(localStorage.getItem(META))}catch(e){}
if(!meta||!Array.isArray(meta.list)||!meta.list.length||!meta.list.includes(meta.cur))meta={cur:'2026-27',list:['2026-27']};
const skey=n=>n==='2026-27'?'mas_choir_v1':'mas_choir_s_'+n;
const saveMeta=()=>{try{localStorage.setItem(META,JSON.stringify(meta))}catch(e){}};
let KEY=skey(meta.cur);
const SYNC='mas_choir_sync';
let sync;try{sync=JSON.parse(localStorage.getItem(SYNC))}catch(e){}
if(!sync||typeof sync!=='object')sync={};
const saveSync=()=>{try{localStorage.setItem(SYNC,JSON.stringify(sync))}catch(e){}};
var _busy=false,_err='',_lastCheck=0,_ap;const _ls={};try{_ls[KEY]=localStorage.getItem(KEY)}catch(e){}
let st;
try{st=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!st||!st.students){st={students:SEED,att:{}}}
const fix=()=>{st.events=st.events||[];st.evAtt=st.evAtt||{};st.holidays=st.holidays||{};st.events.forEach(e=>e.holidays=e.holidays||{});st.att=st.att||{}};fix();
const save=()=>{let s=null;try{s=JSON.stringify(st);localStorage.setItem(KEY,s)}catch(e){}if(s!==null&&s!==_ls[KEY]){_ls[KEY]=s;sync.d=sync.d||{};sync.d[meta.cur]=Date.now();saveSync();refreshSyncUI();if(sync.auto&&sync.url&&sync.key)autoPush()}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const ROM=['I','II','III','IV','V','VI','VII','VIII'];
const clsKey=c=>{const i=ROM.indexOf(c);return i<0?99:i};
let evId='',evDate='',histId='',tab='dash',date=iso(new Date()),q='',fStatus='Active',fClass='',fBatch='',showAll=false,sortK='name',sortD=1,sq='';
const tabs=[['dash','Dashboard'],['att','Attendance'],['ev','Events'],['stu','Students'],['hist','History'],['chk','Data checks']];
const active=()=>st.students.filter(s=>s.status==='Active');
const dow=d=>new Date(d+'T00:00:00').getDay();
const batchOf=d=>[1,3,5].includes(dow(d))?'MWF':[2,4,6].includes(dow(d))?'TTS':'';
function stats(s){let p=0,a=0;for(const d in st.att){if(st.holidays[d])continue;const v=st.att[d][s.id];if(v==='P')p++;else if(v==='A')a++}
 return{p,a,t:p+a,pct:p+a?Math.round(100*p/(p+a)):null}}
const av=(s,c='')=>s.photo?`<img class="av ${c}" src="${s.photo}" alt="">`:`<span class="av ${c}">${esc((s.name||'?').trim().slice(0,1).toUpperCase())}</span>`;
let pendingPhoto='';
function resizeImg(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
 const S=480,k=Math.min(1,S/Math.min(im.width,im.height)),w=im.width*k,h=im.height*k,sz=Math.min(w,h),c=document.createElement('canvas');
 c.width=c.height=sz;c.getContext('2d').drawImage(im,(w-sz)/2/k,(h-sz)/2/k,sz/k,sz/k,0,0,sz,sz);res(c.toDataURL('image/jpeg',.82))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(f)})}
function readPhoto(inp){const f=inp.files[0];inp.value='';if(!f)return;const r=new FileReader();r.onload=()=>cropPhoto(r.result,d=>{if(d){pendingPhoto=d;$('#pv').innerHTML=av({photo:d},'lg')}});r.onerror=()=>alert('Could not read that image');r.readAsDataURL(f)}
function recrop(){if(!pendingPhoto){alert('Upload a photo first');return}cropPhoto(pendingPhoto,d=>{if(d){pendingPhoto=d;$('#pv').innerHTML=av({photo:d},'lg')}})}
/* ---------- Crop photo ---------- */
function cropPhoto(src,done){
 const im=new Image();im.onerror=()=>alert('Could not read that image');
 im.onload=()=>{
  const D=$('#cropd');
  D.innerHTML=`<form method="dialog"><h2>Crop photo</h2><p class="sub" style="margin:4px 0 8px">Drag the box to move it, drag a corner to resize it. The photo is saved as a square.</p><canvas id="cpc" style="width:100%;touch-action:none;border:1px solid var(--line);border-radius:8px;cursor:move"></canvas><div class="row" style="margin-top:8px"><span class="sub">Size</span><input type="range" id="cps" min="20" max="100" value="80" style="flex:1;width:auto"><button type="button" class="b" id="cpr">Rotate ⟳</button></div><div class="row" style="margin-top:10px"><button class="b pri" value="ok">Use this crop</button><button class="b" value="x" formnovalidate>Cancel</button></div></form>`;
  const c=$('#cpc'),g=c.getContext('2d'),sl=$('#cps'),n=Math.min(1,2000/Math.max(im.width,im.height)),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  let rot=0,base,bw,bh,dw,dh,k,box,mv=null,rs=null;
  const hs=()=>Math.max(16,dw/28),corners=()=>[[box.x,box.y],[box.x+box.s,box.y],[box.x,box.y+box.s],[box.x+box.s,box.y+box.s]];
  const draw=()=>{g.clearRect(0,0,dw,dh);g.drawImage(base,0,0,dw,dh);g.fillStyle='rgba(0,0,0,.5)';g.fillRect(0,0,dw,dh);g.drawImage(base,box.x/k,box.y/k,box.s/k,box.s/k,box.x,box.y,box.s,box.s);g.strokeStyle='#fff';g.lineWidth=2;g.strokeRect(box.x,box.y,box.s,box.s);const h=hs();g.fillStyle='#fff';for(const[cx,cy]of corners())g.fillRect(cx-h/2,cy-h/2,h,h)};
  const build=()=>{const sw=im.width*n,sh=im.height*n,a=rot%180?sh:sw,b=rot%180?sw:sh;bw=Math.round(a);bh=Math.round(b);base=document.createElement('canvas');base.width=bw;base.height=bh;const x=base.getContext('2d');x.translate(bw/2,bh/2);x.rotate(rot*Math.PI/180);x.drawImage(im,-sw/2,-sh/2,sw,sh);
   dw=Math.min(bw,900);k=dw/bw;dh=Math.round(bh*k);c.width=dw;c.height=dh;const s=Math.min(dw,dh)*.8;box={x:(dw-s)/2,y:(dh-s)/2,s};sl.value=80;draw()};
  const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*dw/r.width,(e.clientY-r.top)*dh/r.height]};
  c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);const[x,y]=pt(e),h=hs()*1.3,i=corners().findIndex(([cx,cy])=>Math.abs(x-cx)<h&&Math.abs(y-cy)<h);
   if(i>=0){const a=corners()[3-i];rs={i,ax:a[0],ay:a[1]}}
   else{if(!(x>=box.x&&x<=box.x+box.s&&y>=box.y&&y<=box.y+box.s)){box.x=clamp(x-box.s/2,0,dw-box.s);box.y=clamp(y-box.s/2,0,dh-box.s)}mv={ox:x-box.x,oy:y-box.y};draw()}};
  c.onpointermove=e=>{if(!rs&&!mv)return;const[x,y]=pt(e);
   if(rs){const sgx=rs.i%2?1:-1,sgy=rs.i<2?-1:1,mx=sgx>0?dw-rs.ax:rs.ax,my=sgy>0?dh-rs.ay:rs.ay;let s=Math.max(sgx*(x-rs.ax),sgy*(y-rs.ay));s=Math.max(30,Math.min(s,mx,my));box={x:sgx>0?rs.ax:rs.ax-s,y:sgy>0?rs.ay:rs.ay-s,s};sl.value=Math.round(s/Math.min(dw,dh)*100)}
   else{box.x=clamp(x-mv.ox,0,dw-box.s);box.y=clamp(y-mv.oy,0,dh-box.s)}draw()};
  c.onpointerup=c.onpointercancel=()=>{rs=mv=null};
  sl.oninput=()=>{const s=Math.max(30,Math.min(dw,dh)*sl.value/100),cx=box.x+box.s/2,cy=box.y+box.s/2;box.s=s;box.x=clamp(cx-s/2,0,dw-s);box.y=clamp(cy-s/2,0,dh-s);draw()};
  $('#cpr').onclick=()=>{rot=(rot+90)%360;build()};
  D.onclose=()=>{const ok=D.returnValue==='ok';D.returnValue='';if(!ok){done(null);return}
   const side=box.s/k,o=document.createElement('canvas');o.width=o.height=Math.min(480,Math.round(side));o.getContext('2d').drawImage(base,box.x/k,box.y/k,side,side,0,0,o.width,o.height);done(o.toDataURL('image/jpeg',.82))};
  build();D.showModal()};
 im.src=src}
const nk=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
async function importPhotos(files){if(!st.students.length){alert('Import or add students first, then import photos.');return}
 let ok=0;const miss=[];
 for(const f of files){const base=nk(f.name.replace(/\.[^.]+$/,''));
  const s=st.students.find(x=>x.adm&&nk(x.adm)===base)||st.students.find(x=>nk(x.name)===base);
  if(!s){miss.push(f.name);continue}
  try{s.photo=await resizeImg(f);ok++}catch(e){miss.push(f.name)}}
 save();render();
 alert(ok+' photo(s) matched and imported.'+(miss.length?'\n\nNo match for: '+miss.slice(0,15).join(', ')+(miss.length>15?'…':'')+'\n(Name each file with the Adm. No. or the exact student name, e.g. J09049.jpg)':''))}
function pctPill(x){if(x==null)return'<span class="mut">–</span>';return`<span class="pill ${x>=75?'ok':x>=50?'warn':'bad'}">${x}%</span>`}

function mobTables(){document.querySelectorAll('#main table').forEach(t=>{const ths=[...t.querySelectorAll('thead th')];if(ths.length<5)return;t.classList.add('rt');if(!ths.some(h=>h.hasAttribute('onclick')))t.classList.add('nohd');
 t.querySelectorAll('tbody tr').forEach(r=>[...r.children].forEach((c,i)=>{if(c.tagName==='TD'&&!c.dataset.l&&ths[i]){const l=ths[i].textContent.replace(/[▲▼]/g,'').trim();if(l)c.dataset.l=l}}))})}
function render(){
 const wasQ=document.activeElement&&document.activeElement.id==='q';
 $('#nav').innerHTML=tabs.map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('');
 $('#main').innerHTML={dash,att,stu,ev,hist,chk}[tab]();mobTables();
 if(wasQ&&(tab==='stu'||tab==='att')){const e=$('#q');if(e){e.focus();e.setSelectionRange(e.value.length,e.value.length)}}
}
/* ---------- Dashboard ---------- */
function dash(){
 if(!st.students.length)return empty();
 const A=active(),dates=Object.keys(st.att).filter(d=>!st.holidays[d]).sort();
 const all=st.students;const cnt=k=>all.filter(s=>s.status===k).length;
 const rows=A.map(s=>({s,...stats(s)}));
 const marked=rows.filter(r=>r.t);
 const avg=marked.length?Math.round(marked.reduce((x,r)=>x+r.pct,0)/marked.length):null;
 const by=(f)=>{const m={};A.forEach(s=>{const k=f(s)||'—';m[k]=(m[k]||0)+1});return m};
 const cls=by(s=>s.cls),bat=by(s=>s.batch),gen=by(s=>s.gender);
 const mini=(m,sort)=>Object.entries(m).sort(sort||((a,b)=>b[1]-a[1])).map(([k,v])=>`<tr><td>${esc(k)}</td><td style="width:55%"><div class="bar"><i style="width:${100*v/A.length}%;background:var(--acc)"></i></div></td><td style="text-align:right">${v}</td></tr>`).join('');
 const low=marked.filter(r=>r.pct<75).sort((a,b)=>a.pct-b.pct).slice(0,8);
 const trend=dates.slice(-14).map(d=>{const v=Object.values(st.att[d]);const p=v.filter(x=>x==='P').length;return{d,p,n:v.length}});
 const W=520,H=130,bw=Math.min(W/Math.max(trend.length,1),48);

function chk(){

function delHoliday(d){delete st.holidays[d];save();render()}
function addHolRange(){const a=$('#hf').value,b=$('#ht').value||a,r=$('#hr').value.trim(),skip=$('#hs2').checked;if(!a){alert('Choose a start date');return}
 if(b<a){alert('End date is before start date');return}
 let d=new Date(a+'T00:00:00'),end=new Date(b+'T00:00:00'),n=0;
 while(d<=end&&n<366){if(!(skip&&d.getDay()===0)){st.holidays[iso(d)]={reason:r};n++}d.setDate(d.getDate()+1)}
 save();render()}

/* ---------- Auto batch (MWF / TTS) balancing ---------- */
function autoBatch(role,gender,pool){pool=(pool||st.students).filter(s=>s.status==='Active'&&(s.batch==='MWF'||s.batch==='TTS'));
 const cell=pool.filter(s=>(s.role||'')===(role||'')&&(s.gender||'')===(gender||''));
 const c=b=>cell.filter(s=>s.batch===b).length,o=b=>pool.filter(s=>s.batch===b).length;
 if(c('MWF')!==c('TTS'))return c('MWF')<c('TTS')?'MWF':'TTS';
 if(o('MWF')!==o('TTS'))return o('MWF')<o('TTS')?'MWF':'TTS';
 return 'MWF'}
function toast(m){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';document.body.appendChild(e)}e.textContent=m;e.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.opacity=0,4500)}
function balanceCard(A){const keys=[];['Singer','Ordinary',''].forEach(r=>['Male','Female',''].forEach(g=>{if(A.some(s=>(s.role||'')===r&&(s.gender||'')===g))keys.push([r,g])}));
 const cnt=(f,b)=>A.filter(s=>f(s)&&s.batch===b).length;const diff=(m,t)=>{const d=Math.abs(m-t);return`<span class="pill ${d<=1?'ok':d<=3?'warn':'bad'}">${d<=1?'balanced':'off by '+d}</span>`};
 const rows=keys.map(([r,g])=>{const f=s=>(s.role||'')===r&&(s.gender||'')===g,m=cnt(f,'MWF'),t=cnt(f,'TTS');return`<tr><td>${r||'No role'} · ${g||'No gender'}</td><td>${m}</td><td>${t}</td><td>${diff(m,t)}</td></tr>`}).join('');
 const M=A.filter(s=>s.batch==='MWF').length,T=A.filter(s=>s.batch==='TTS').length;
 return`<div class="card"><h2>MWF / TTS balance</h2><div class="sub" style="margin-bottom:8px">New students are placed automatically (Batch “Auto”) to keep each Role + Gender group, and the two batches overall, as even as possible.</div>
 <table><thead><tr><th>Role · Gender</th><th>MWF</th><th>TTS</th><th></th></tr></thead><tbody>${rows}<tr><td><b>All active</b></td><td><b>${M}</b></td><td><b>${T}</b></td><td>${diff(M,T)}</td></tr></tbody></table></div>`}

/* ---------- Scan ID card (OCR) ---------- */
const ROMANS={1:'I',2:'II',3:'III',4:'IV',5:'V',6:'VI',7:'VII',8:'VIII',9:'IX',10:'X'};
function parseId(text){
 const L=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),T=L.join('\n'),o={};
 let m=T.match(/(?:adm(?:ission)?\.?\s*(?:no\.?|number|#)?|reg(?:istration)?\.?\s*no\.?|id\s*no\.?)\s*[:\-.]?\s*([A-Za-z]{0,3}[\s-]?[0-9OIl]{3,8})/i)||T.match(/\b([Jj][\s-]?[0-9OIl]{4,6})\b/);
 if(m){o.adm=m[1].replace(/[\s-]/g,'').toUpperCase().replace(/^([A-Z])(.*)$/,(x,a,b)=>a+b.replace(/O/g,'0').replace(/[IL]/g,'1'));if(/^[1IL]\d{5}$/.test(o.adm))o.adm='J'+o.adm.slice(1)}
 const parentLine=l=>/^\s*[A-RT-Za-rt-z]\s*[.,]?\s*name\b/i.test(l)||/\b(mother|father|mom|dad|parent|guardian|spouse)\b/i.test(l);
 let nm=null;for(const l of L){if(parentLine(l))continue;const k=l.match(/(?:\b(?:student|candidate|pupil|s)'?s?\s*[.,]?\s*)?\bname\s*[:\-.]?\s*(.+)$/i);if(k&&/[A-Za-z]{2}/.test(k[1])){nm=k[1];break}}
 if(!nm){nm=L.find(l=>/^[A-Za-z][A-Za-z .]{4,28}$/.test(l)&&l.trim().split(/\s+/).length>=2&&!parentLine(l)&&l.split(/\s+/).some(w=>w.replace(/\W/g,'').length>=3)&&!/school|vidyalaya|public|class|address|phone|valid|principal|session|sec(tion)?|male|mobile|contact|name|d\.?o\.?b|birth|campus|bhagalpur|assisi|mount|headmaster|signature|address|year/i.test(l))||''}
 if(nm)o.name=nm.replace(/[^A-Za-z .]/g,' ').replace(/\s+/g,' ').trim().toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
 m=T.match(/(?:class|std|standard)\s*[:\-.]?\s*([IVXivx]{1,4}|\d{1,2})(?:\s*(?:th|st|nd|rd))?\s*[-/\s]?\s*([A-Fa-f])?\b/i);
 if(m){let c=m[1].toUpperCase();if(/^\d+$/.test(c))c=ROMANS[+c]||c;o.cls=c;if(m[2])o.sec=m[2].toUpperCase()}
 if(!o.cls){for(const l of L){const k=l.match(/^\W*([IVX]{1,4}|\d{1,2})\s*[-\u2013\u2014_\/.|]?\s*([A-F])\W*$/);if(k&&(/[-\u2013\u2014_\/.|\s]/.test(l.trim().slice(1,-1))||k[1].length>1)){let c=k[1];if(/^\d+$/.test(c))c=ROMANS[+c]||c;o.cls=c;o.sec=k[2];break}}}
 if(!o.cls){for(const l of L){const s=l.replace(/[\u2010-\u2015~=_|]/g,'-'),k=s.match(/(?:^|[^A-Za-z0-9])([IVX]{1,4}|\d{1,2})\s*-\s*([A-F])(?![A-Za-z0-9])/);if(k){let c=k[1];if(/^\d+$/.test(c))c=ROMANS[+c]||c;o.cls=c;o.sec=k[2];break}}}
 if(!o.sec){m=T.match(/\bsec(?:tion)?\.?\s*[:\-.]?\s*([A-Fa-f])\b/i);if(m)o.sec=m[1].toUpperCase()}
 const phL=L.map((l,i)=>({l,i,n:[...l.matchAll(/(?:\+?91[\s-]?)?([6-9]\d{4}[\s-]?\d{5})/g)].map(x=>x[1].replace(/\D/g,''))})).filter(x=>x.n.length&&!/school|vidyalaya|public|campus/i.test(x.l)&&!/school|vidyalaya/i.test(L.slice(Math.max(0,x.i-2),x.i).join(' ')));
 if(phL.length>1)while(phL.length>1&&phL[0].i<4)phL.shift();
 let ph=[...new Set(phL.flatMap(x=>x.n))];if(ph.length>2&&phL.length)ph=phL[phL.length-1].n;
 if(ph.length)o.phone=ph.slice(0,2).join(', ');
 if(/\bfemale\b|\bgirl\b/i.test(T))o.gender='Female';else if(/\bmale\b|\bboy\b/i.test(T))o.gender='Male';
 return o}
const loadScript=u=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.onload=res;s.onerror=()=>rej(new Error('Could not load the text reader (internet needed)'));document.head.appendChild(s)});
const clsFromBox=s=>{s=(s||'').toUpperCase().replace(/[^IVXA-F0-9]/g,'');const m=s.match(/^([IVX]{1,4}|\d{1,2})([A-F])$/);if(!m)return null;let c=m[1];if(/^\d+$/.test(c))c=ROMANS[+c]||c;return{cls:c,sec:m[2]}};
async function scanId(file){if(!file)return;
 const img=await new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=URL.createObjectURL(file)});
 if(!img){alert('Could not open that image');return}
 const W=Math.min(img.naturalWidth,1100),k=W/img.naturalWidth,H=Math.round(img.naturalHeight*k);
 const F=[['P','1 · Student photo','#e0206a','mas_idbox'],['N','2 · Name','#2f7d4f','mas_idbox_name'],['C','3 · Class & section','#1d5fbf','mas_idbox_cls'],['A','4 · Adm. no','#b7791f','mas_idbox_adm'],['H','5 · Phone no','#7c3aed','mas_idbox_ph']];
 $('#frm').innerHTML=`<h2>Scan ID card</h2><p class="sub" style="margin:4px 0 8px">Choose a field, then drag a box on the card over it (photo, name, class, adm. no, phone). Mark as many as you like — anything not marked is searched for automatically. Positions are remembered for the next cards.</p>
 <div id="idsel" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">${F.map(f=>`<button type="button" class="b" data-m="${f[0]}" style="border-color:${f[2]};color:${f[2]};padding:6px 12px;font-size:15px"></button>`).join('')}<button type="button" class="b" id="idclr" style="padding:6px 12px;font-size:15px">Clear this area</button></div>
 <canvas id="idc" style="width:100%;touch-action:none;border:1px solid var(--line);border-radius:8px;cursor:crosshair"></canvas><div id="idst" class="sub" style="margin:8px 0">Everything is read on this device. The first scan needs internet to load the reader.</div><div class="row"><button type="button" class="b pri" id="idgo">Read details</button><button class="b" value="x" formnovalidate>Cancel</button></div>`;
 const c=$('#idc');c.width=W;c.height=H;const g=c.getContext('2d');

async function gcall(action,extra){
 if(!sync.url||!sync.key)throw new Error('Enter the Web app URL and the key first');

 let j;try{j=await r.json()}catch(e){throw new Error('Google did not send data back — check the Web app URL, and that access is set to “Anyone”')}
 if(!j.ok&&!j.conflict)throw new Error(j.error||'Google returned an error');return j}

const cfgOk=()=>!!(sync.url&&sync.key);

 if(!r){if(has){await doPush(name,0,true);if(!silent)toast('Sent '+name+' to Google')}else if(!silent)toast('Nothing to sync yet');return}

 d.onclose=async()=>{const v=d.returnValue;d.returnValue='';
  try{
   if(v==='merge'){const j=await gcall('pull',{session:name});const m=j.data?mergeData(st,j.data):st;st=m;fix();const s=JSON.stringify(st);try{localStorage.setItem(KEY,s)}catch(e){}_ls[KEY]=s;
    const p=await gcall('push',{session:name,data:st,base:j.version||0,force:true});sync.v=sync.v||{};sync.v[name]=p.version;sync.t=sync.t||{};sync.t[name]=Date.now();sync.d=sync.d||{};delete sync.d[name];saveSync();render();toast('Combined both copies and synced · '+st.students.length+' students')}
   else if(v==='google'){await doPull(name,'Replaced with Google’s copy')}
   else if(v==='device'){const j=await gcall('push',{session:name,data:st,base:0,force:true});sync.v=sync.v||{};sync.v[name]=j.version;sync.t=sync.t||{};sync.t[name]=Date.now();sync.d=sync.d||{};delete sync.d[name];saveSync();toast('Google now has this device’s copy')}
   else{_err='Two copies need your decision — click Sync';}
  }catch(e){_err=e.message;alert('Google sync: '+e.message)}
  refreshSyncUI();res()};
 d.showModal()})}
function syncSetup(){const d=$('#dlg');d.classList.remove('wide');$('#frm').oninput=null;$('#frm').onchange=null;
 $('#frm').innerHTML=syncCard().replace(/<button class="b/g,'<button type="button" class="b')+'<div class="row" style="margin-top:12px"><button class="b" value="x" formnovalidate>Close</button></div>';
 d.onclose=()=>{d.returnValue='';refreshSyncUI();if(cfgOk()&&sync.auto)syncNow(true)};d.showModal()}
function syncCard(){return`<div class="card"><h2>Google Sheet sync</h2><p class="sub" style="margin:0 0 8px">Keeps this session the same on every phone and computer. Changes are sent to your Google Drive (readable Students / Attendance sheets plus a full backup), and changes made on another device are picked up automatically. Paste the Web app URL and key from your Apps Script.</p>
 <div class="row"><input placeholder="Web app URL (https://script.google.com/macros/s/…/exec)" value="${esc(sync.url||'')}" oninput="sync.url=this.value.trim();saveSync();refreshSyncUI()" style="flex:1 1 280px"><input type="password" placeholder="Secret key" value="${esc(sync.key||'')}" oninput="sync.key=this.value.trim();saveSync();refreshSyncUI()" style="flex:1 1 160px"></div>
 <div class="row"><button class="b" onclick="gRun(gTest)">Test connection</button><button class="b pri" onclick="syncNow(false)">Sync now</button><button class="b" onclick="gRun(()=>gPush())">Send ${esc(meta.cur)} to Google</button><button class="b" onclick="gRun(gSessions)">Get from Google…</button></div>
 <label class="sub" style="display:flex;gap:8px;align-items:center;margin:0"><input type="checkbox" ${sync.auto?'checked':''} onchange="sync.auto=this.checked;saveSync();if(this.checked)syncNow(true)" style="width:auto"> Keep in sync automatically (when the app opens, every minute, and a few seconds after each change)</label>
 <div class="sub" id="gst" style="margin-top:6px">${esc(gLine())}</div></div>`}
async function gTest(){const j=await gcall('ping');if(sync.auto===undefined){sync.auto=true;saveSync();alert((j.msg||'Connected')+'\n\nAutomatic two-way sync is now on.');render();syncNow(true)}else alert(j.msg||'Connected')}
async function gPush(){const name=meta.cur;const stamp=(sync.d||{})[name];
 if(!confirm('Replace the copy of session '+name+' in Google with the data on this device?\n\n(Use “Sync now” instead to combine safely with changes from other devices.)'))return;
 const j=await gcall('push',{session:name,data:st,base:0,force:true});
 sync.v=sync.v||{};sync.v[name]=j.version;sync.t=sync.t||{};sync.t[name]=Date.now();sync.d=sync.d||{};if(sync.d[name]===stamp)delete sync.d[name];saveSync();refreshSyncUI();
 toast('Sent '+name+' to Google · '+j.students+' students');const e=$('#gst');if(e)e.textContent=gLine()}
async function gSessions(){const j=await gcall('list'),d=$('#dlg');
 $('#frm').oninput=null;$('#frm').onchange=null;d.classList.remove('wide');
 $('#frm').innerHTML=`<h2>Sessions in Google</h2>${j.sessions.length?j.sessions.map(x=>`<div class="row" style="justify-content:space-between;margin:8px 0;flex-wrap:nowrap"><div><b>${esc(x.name)}</b><div class="sub">saved ${esc(new Date(+x.updated).toLocaleString())}${meta.list.includes(x.name)?' · also on this device':''}</div></div><button type="button" class="b pri" data-n="${esc(x.name)}" onclick="gGet(this.dataset.n)">Download</button></div>`).join(''):'<p class="mut">Nothing is saved in Google yet. Use “Sync now” first.</p>'}<div class="row" style="margin-top:12px"><button class="b" value="x" formnovalidate>Close</button></div>`;
 d.onclose=()=>{d.returnValue=''};d.showModal()}
async function gGet(name){try{
 if(meta.list.includes(name)&&!confirm('Replace session '+name+' on this device with the copy from Google?'))return;
 const j=await gcall('pull',{session:name});if(!j.data){alert('Nothing found in Google for '+name);return}
 const k=skey(name),s=JSON.stringify(j.data);try{localStorage.setItem(k,s)}catch(e){alert('Not enough browser storage for this session.');return}
 $('#dlg').close();_ls[k]=s;
 if(!meta.list.includes(name))meta.list.push(name);
 meta.cur=name;saveMeta();KEY=k;sync.v=sync.v||{};sync.v[name]=j.version;sync.t=sync.t||{};sync.t[name]=Date.now();sync.d=sync.d||{};delete sync.d[name];saveSync();
 loadSess();refreshSyncUI();toast('Downloaded '+name+' from Google')}
 catch(e){alert('Google sync: '+e.message)}}
/* automatic triggers */
setInterval(()=>{if(sync.auto&&cfgOk()&&!document.hidden&&Date.now()-_lastCheck>25000)syncNow(true)},15000);
setInterval(refreshSyncUI,10000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&sync.auto&&cfgOk()&&Date.now()-_lastCheck>15000)syncNow(true)});
window.addEventListener('online',()=>{if(sync.auto&&cfgOk())syncNow(true)});
setTimeout(()=>{refreshSyncUI();if(sync.auto&&cfgOk())syncNow(true)},1200);
/* ---------- Sessions / years ---------- */
function sessUI(){const e=$('#sess');if(e)e.innerHTML=meta.list.map(n=>`<option ${n===meta.cur?'selected':''}>${esc(n)}</option>`).join('')+'<option value="__new">+ New session…</option>';document.title='MAS Choir Tracker '+meta.cur}
function loadSess(){let o;try{o=JSON.parse(localStorage.getItem(KEY))}catch(e){}st=(o&&o.students)?o:{students:[],att:{}};fix();histId='';evId='';evDate='';date=iso(new Date());tab='dash';sessUI();render()}
function sessPick(v){if(v==='__new'){sessUI();sessNew();return}if(v===meta.cur)return;save();meta.cur=v;saveMeta();KEY=skey(v);try{_ls[KEY]=localStorage.getItem(KEY)}catch(e){}loadSess();if(sync.auto&&sync.url&&sync.key)syncNow(true)}
function nextSess(c){const m=String(c).match(/^(\d{4})\s*[-–]\s*(\d{2,4})$/);if(!m)return'';const a=+m[1]+1;return a+'-'+String((a+1)%100).padStart(2,'0')}
function sessNew(){const d=$('#dlg'),chk='display:flex;align-items:center;gap:8px;color:var(--ink);font-size:17px';
 $('#frm').oninput=null;$('#frm').onchange=null;d.classList.remove('wide');
 $('#frm').innerHTML=`<h2>New session / year</h2><p class="mut" style="margin:4px 0 0">Each session keeps its own students, attendance, events and holidays. Switch between sessions from the top of the page.</p>
 <label>Session name (e.g. 2027-28)<input name="sn" value="${esc(nextSess(meta.cur))}" placeholder="2027-28"></label>
 <label style="${chk}"><input type="checkbox" name="cp" checked style="width:auto"> Copy active students from ${esc(meta.cur)} (attendance is not copied)</label>
 <label style="${chk}"><input type="checkbox" name="up" style="width:auto"> Move copied students up one class (class ${ROM[ROM.length-1]} students are not copied)</label>
 <label style="${chk}"><input type="checkbox" name="ph" checked style="width:auto"> Copy photos too</label>
 <div class="row" style="margin-top:12px"><button class="b pri" value="ok">Create session</button><button class="b" value="x" formnovalidate>Cancel</button></div>`;
 d.onclose=()=>{const v=d.returnValue;d.returnValue='';if(v!=='ok')return;const F=$('#frm'),n=F.elements.sn.value.trim();
  if(!n){alert('Please enter a session name');return}
  if(meta.list.includes(n)){alert('A session named '+n+' already exists — pick it from the list at the top.');return}
  save();let list=[];
  if(F.elements.cp.checked){list=JSON.parse(JSON.stringify(active()));
   if(F.elements.up.checked)list=list.filter(s=>s.cls!==ROM[ROM.length-1]).map(s=>{const i=ROM.indexOf(s.cls);if(i>=0)s.cls=ROM[i+1];return s})}
  const mk=ph=>({students:list.map(s=>ph?s:{...s,photo:''}),att:{},events:[],evAtt:{},holidays:{}});
  let ns=mk(F.elements.ph.checked),msg='';
  try{localStorage.setItem(skey(n),JSON.stringify(ns))}catch(e){
   try{ns=mk(false);localStorage.setItem(skey(n),JSON.stringify(ns));msg=' · photos not copied (browser storage full)'}catch(e2){alert('Not enough browser storage to create a new session. Download a backup first, then try again without copying photos.');return}}
  meta.list.push(n);meta.cur=n;saveMeta();KEY=skey(n);loadSess();toast('Session '+n+' created'+(list.length?' · '+list.length+' students copied':'')+msg)};
 d.showModal()}
sessUI();render();
</script></body></html>
